<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gig List - Profile Selection</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎸</text></svg>">
    <link rel="icon" type="image/png" href="assets/icon-512.png">

    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GigVault">
    <link rel="apple-touch-icon" href="assets/icon-512.png">

    <script>tailwind = { corePlugins: { preflight: true } };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .user-card:active { transform: scale(0.98); }
        /* Ensure focus states are visible for keyboard users */
        .user-card:focus-visible {
            outline: 3px solid #4f46e5;
            outline-offset: 4px;
        }
    </style>
</head>

<body class="bg-slate-50 flex flex-col items-center justify-center min-h-screen p-6">

<main class="w-full max-w-sm mx-auto space-y-8 pt-12" role="main">
    <header class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-indigo-600 rounded-[2rem] shadow-xl shadow-indigo-200 mb-4 rotate-3" aria-hidden="true">
            <span class="text-4xl">🎸</span>
        </div>
        <h1 class="text-5xl font-black italic tracking-tighter text-slate-900 uppercase">GIG LIST</h1>
        <p id="instruction" class="text-slate-400 font-bold text-sm uppercase tracking-widest">
            Select Archive Mode
        </p>
    </header>

    <div id="modeSelection" class="space-y-4">
        <button onclick="window.location.href='index.html?mode=Individual'"
                aria-label="Select Individual mode — Personal Memories"
                class="w-full p-8 bg-white border-2 border-slate-100 rounded-[2.5rem] shadow-lg hover:border-indigo-500 transition-all text-center">
            <span class="block text-2xl font-black uppercase italic">Individual</span>
            <span class="block text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">Personal Memories</span>
        </button>

        <button onclick="window.location.href='index.html?mode=Band'"
                aria-label="Select Band mode — Official Archives"
                class="w-full p-8 bg-slate-900 text-white rounded-[2.5rem] shadow-lg hover:ring-4 ring-indigo-500/20 transition-all text-center">
            <span class="block text-2xl font-black uppercase italic">Band Mode</span>
            <span class="block text-[10px] text-indigo-300 font-bold uppercase tracking-widest mt-1">Official Archives</span>
        </button>
    </div>

    <div id="userListSection" class="hidden space-y-4">
        <div class="flex justify-between items-center mb-2">
            <button onclick="window.location.href='index.html'" class="text-[10px] font-black text-indigo-600 uppercase tracking-widest flex items-center gap-1">
                ← Back to Modes
            </button>
        </div>

        <div id="userList" class="space-y-3" role="list" aria-live="polite">
            <div id="loadingSkeleton" class="animate-pulse space-y-3">
                <div class="h-20 bg-slate-100 rounded-[2rem] w-full"></div>
                <div class="h-20 bg-slate-100 rounded-[2rem] w-full"></div>
            </div>
        </div>
    </div>

    <footer class="pt-8 text-center">
        <p class="text-[10px] text-slate-300 font-black uppercase tracking-widest">
            &copy; 2026 Strictly GigList
        </p>
    </footer>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const requestedMode = urlParams.get('mode');

        const modeSelection = document.getElementById('modeSelection');
        const userListSection = document.getElementById('userListSection');
        const instruction = document.getElementById('instruction');

        if (requestedMode) {
            modeSelection.classList.add('hidden');
            userListSection.classList.remove('hidden');
            instruction.innerText = `Select ${requestedMode} Profile`;
            loadUsers(requestedMode);
        }

        function loadUsers(mode) {
            const csvPath = `data/users.csv?v=${new Date().getTime()}`;

            Papa.parse(csvPath, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const container = document.getElementById('userList');
                    const skeleton = document.getElementById('loadingSkeleton');
                    container.innerHTML = '';
                    if(skeleton) skeleton.classList.add('hidden');

                    const filtered = results.data.filter(u => {
                        if (!u.UserName && !u.user_name) return false;
                        const rawType = (u.Type || '').trim().toLowerCase();
                        const targetMode = mode.toLowerCase();

                        // Map 'Individual' request to 'Personal' CSV data
                        if (targetMode === 'individual') {
                            return rawType === 'personal';
                        }
                        return rawType === targetMode;
                    });

                    if (filtered.length === 0) {
                        container.innerHTML = `<p class="text-center text-slate-400 font-bold py-10">No ${mode} profiles found.</p>`;
                        return;
                    }

                    filtered.forEach(user => {
                        const name = user.UserName || user.user_name;
                        const btn = document.createElement('button');
                        btn.className = "w-full p-6 bg-white border-2 border-white hover:border-indigo-100 shadow-sm hover:shadow-xl transition-all duration-300 rounded-[2rem] flex justify-between items-center group";

                        btn.innerHTML = `
                            <div class="flex flex-col items-start text-left">
                                <span class="text-[10px] text-slate-400 font-black uppercase tracking-widest mb-1 group-hover:text-indigo-600 transition-colors">
                                    Archive
                                </span>
                                <span class="text-2xl font-black text-slate-900 tracking-tighter">${name}</span>
                            </div>
                            <div class="bg-slate-50 group-hover:bg-indigo-600 w-12 h-12 rounded-2xl flex items-center justify-center transition-all duration-300" aria-hidden="true">
                                <span class="text-slate-400 group-hover:text-white font-black">→</span>
                            </div>
                        `;

                        btn.onclick = () => {
                            localStorage.setItem('gv_user', JSON.stringify(user));
                            window.location.href = 'vault.html';
                        };

                        container.appendChild(btn);
                    });
                }
            });
        }
    });
</script>
<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
</script>
</body>
</html>
