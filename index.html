<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gig List - Profile Selection</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎸</text></svg>">
    <link rel="icon" type="image/png" href="assets/icon-512.png">

    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GigVault">
    <link rel="apple-touch-icon" href="assets/icon-512.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .user-card:active { transform: scale(0.98); }
        /* Ensure focus states are visible for keyboard users */
        .user-card:focus-visible {
            outline: 3px solid #4f46e5;
            outline-offset: 4px;
        }
    </style>
</head>

<body class="bg-slate-50 flex flex-col items-center justify-center min-h-screen p-6">

<main class="w-full max-w-sm space-y-8" role="main">

    <header class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-indigo-600 rounded-[2rem] shadow-xl shadow-indigo-200 mb-4 rotate-3" aria-hidden="true">
            <span class="text-4xl">🎸</span>
        </div>
        <h1 class="text-5xl font-black italic tracking-tighter text-slate-900">GIG LIST</h1>
        <p id="instruction" class="text-slate-400 font-bold text-sm uppercase tracking-widest">Select Profile to Enter</p>
    </header>

    <div id="journalsSection" class="hidden space-y-4">
        <h2 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-2 ml-4">Personal Journals</h2>
        <div id="userList" class="space-y-3" role="list"></div>
    </div>

    <div id="artistsSection" class="hidden space-y-4 pt-4">
        <h2 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-2 ml-4">Artist Archives</h2>
        <div id="artistList" class="space-y-3" role="list"></div>
    </div>

    <div id="loadingSkeleton" class="animate-pulse space-y-3">
        <div class="h-20 bg-slate-200 rounded-3xl w-full"></div>
        <div class="h-20 bg-slate-200 rounded-3xl w-full"></div>
    </div>

    <footer class="pt-8">
        <p class="text-center text-[10px] text-slate-300 font-black uppercase tracking-widest">
            &copy; 2026 Archive Engine
        </p>
    </footer>
</main>

<script>
    const csvPath = `data/users.csv?v=${new Date().getTime()}`;

    Papa.parse(csvPath, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
    const userContainer = document.getElementById('userList');
    const artistContainer = document.getElementById('artistList');
    const skeleton = document.getElementById('loadingSkeleton');

    // Clear initial state
    userContainer.innerHTML = '';
    artistContainer.innerHTML = '';
    skeleton.classList.add('hidden');

    results.data.forEach(user => {
        const name = user.UserName || user.user_name;
        if(!name) return;

        const isBand = user.Type === 'Band';
        const wrapper = document.createElement('div');
        wrapper.setAttribute('role', 'listitem');

        const btn = document.createElement('button');
        // We'll use a specific hover color for Bands later
        btn.className = "user-card w-full p-6 bg-white border-2 border-white hover:border-blue-100 shadow-sm hover:shadow-xl transition-all duration-300 rounded-[2rem] flex justify-between items-center group relative overflow-hidden";

        btn.innerHTML = `
            <div class="flex flex-col items-start text-left relative z-10">
                <span class="text-[10px] text-slate-400 font-black uppercase tracking-widest mb-1 group-hover:text-blue-600 transition-colors">
                    ${isBand ? 'Artist Archive' : 'User Profile'}
                </span>
                <span class="text-2xl font-black text-slate-900 tracking-tighter">${name}</span>
            </div>
            <div class="bg-slate-50 group-hover:bg-blue-600 w-12 h-12 rounded-2xl flex items-center justify-center transition-all duration-300 relative z-10">
                <span class="text-slate-400 group-hover:text-white font-black">→</span>
            </div>
        `;

        btn.onclick = () => {
            localStorage.setItem('gv_user', JSON.stringify(user));
            window.location.href = 'vault.html';
        };

        wrapper.appendChild(btn);

        if (isBand) {
            artistContainer.appendChild(wrapper);
            document.getElementById('artistsSection').classList.remove('hidden');
        } else {
            userContainer.appendChild(wrapper);
            document.getElementById('journalsSection').classList.remove('hidden');
        }
    });
}
    });
</script>
<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log("Service Worker Registered"))
        .catch((err) => console.log("Service Worker Failed", err));
    }
</script>
</body>
</html>
