<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GigList | Show Detail</title>

    <meta property="og:type" content="website">
    <meta property="og:title" content="Live Music Memory on GigList">
    <meta property="og:description" content="Check out this performance and setlist.">
    <meta property="og:image" content="https://slobulike.github.io/GigList/assets/og-preview.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,800;1,800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div id="loader" class="fixed inset-0 flex items-center justify-center bg-slate-950 z-50">
    <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-indigo-500"></div>
</div>

<main id="main-content" class="hidden max-w-md mx-auto p-6 pb-24">
    <div class="flex justify-center mb-10">
            <span class="text-xs font-black tracking-[0.3em] uppercase text-indigo-500 bg-indigo-500/10 px-4 py-1.5 rounded-full border border-indigo-500/20">
                Strictly GigList
            </span>
    </div>

    <header class="text-center mb-8">
        <h1 id="band-name" class="text-5xl font-black italic tracking-tighter mb-2 text-white"></h1>
        <div id="venue-date" class="text-slate-400 font-medium"></div>
    </header>

    <div id="social-proof" class="bg-slate-900/50 border border-slate-800 rounded-3xl p-5 mb-8 flex items-center justify-between">
        <div class="flex -space-x-3">
            <div class="w-10 h-10 rounded-full border-2 border-slate-900 bg-indigo-600 flex items-center justify-center text-xs">🤘</div>
            <div class="w-10 h-10 rounded-full border-2 border-slate-900 bg-emerald-600 flex items-center justify-center text-xs">🎸</div>
        </div>
        <p class="text-xs font-bold text-slate-300">
            <span id="attendee-count">...</span> GigList users were here
        </p>
    </div>

    <section class="mb-10">
        <h2 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 mb-4 px-1">Setlist</h2>
        <div id="setlist-content" class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-sm leading-relaxed italic text-slate-300 whitespace-pre-line">
            No setlist available for this performance.
        </div>
    </section>

    <section class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-slate-950 via-slate-950 to-transparent">
        <div class="max-w-md mx-auto">
            <a href="index.html" class="block w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white text-center rounded-2xl font-black uppercase tracking-widest transition-transform active:scale-95 shadow-xl shadow-indigo-500/20">
                Track your own gigs
            </a>
        </div>
    </section>
</main>

<script type="module">
    import { supabase } from './js/modules/supabase.js';

    async function loadPublicGig() {
        const params = new URLSearchParams(window.location.search);
        const encodedKey = params.get('k');

        if (!encodedKey) {
            showError("No show key provided.");
            return;
        }

        try {
            const rawKey = atob(encodedKey);
            console.log("Fetching show for key:", rawKey);

            // 1. Fetch Performance (Using lowercase column names from your SQL results)
            const { data: performance, error: perfError } = await supabase
                .from('performances')
                .select('*')
                .eq('journal_key', rawKey)
                .limit(1)        // Add this: tells Postgres to stop at one
                .maybeSingle();  // Add this: handles 0 or 1 row gracefully

            if (perfError) throw perfError;
            if (!performance) throw new Error("Show details not found in database.");

            // 2. Fetch Attendee Count (Table is 'journals' plural based on your state.md)
            const { count, error: countError } = await supabase
                .from('journals')
                .select('*', { count: 'exact', head: true })
                .eq('journal_key', rawKey);

            // 3. Render UI
            document.getElementById('band-name').textContent = performance.artist;
            document.getElementById('venue-date').textContent =
                `${performance.official_venue} • ${performance.date}`;

            // Logic for the count (at least 1 if we found the performance)
            document.getElementById('attendee-count').textContent = count || 1;

            if (performance.setlist) {
                // Clean up the pipe-separated setlist from your SQL result
                const formattedSetlist = performance.setlist
                    .split('|')
                    .filter(s => s.trim())
                    .map(s => `• ${s.trim()}`)
                    .join('\n');
                document.getElementById('setlist-content').textContent = formattedSetlist;
            }

            document.title = `${performance.artist} at ${performance.official_venue} | GigList`;
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            if (window.lucide) lucide.createIcons();

        } catch (err) {
            console.error("Public Page Error:", err);
            showError(err.message);
        }
    }

    function showError(msg) {
        document.getElementById('loader').innerHTML = `
            <div class="text-center p-6 max-w-xs">
                <p class="text-red-400 font-bold mb-4">${msg}</p>
                <a href="index.html" class="inline-block px-6 py-2 bg-slate-800 rounded-xl text-xs uppercase tracking-widest text-white">Return to GigList</a>
            </div>
        `;
    }

    loadPublicGig();
</script>
</body>
</html>
